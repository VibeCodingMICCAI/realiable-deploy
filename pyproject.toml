[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-to-trustworthy-ai"
version = "0.1.0"
description = "From vibe coding to trustworthy AI: testing, reproducibility and readiness with a knee MRI segmentation prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MICCAI Vibe Coding Tutorial" }]
dependencies = [
  "numpy>=1.26,<3",
  "nibabel>=5.2,<6",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
infer = [
  "torch>=2.1",
  "nnunetv2",
  "SimpleITK>=2.3",
]

[project.scripts]
vibe-demo = "vibe_to_trust.cli:demo_main"
vibe-reproduce = "vibe_to_trust.cli:reproduce_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
